[package]
name = "stratide-ledger"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
stratide-contracts = { path = "../contracts" }
stratide-risk = { path = "../risk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
