# Build the Windows x64 installer and publish it on the matching GitHub Release.
# Public repo: standard windows-latest only. GITHUB_TOKEN is used solely to upload the Release.
name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Build and publish installer
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require a stable version tag
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "REFUSING_TAG $($env:RELEASE_TAG). Expected vMAJOR.MINOR.PATCH."
          }
          $version = $Matches[1]
          $head = (git rev-parse HEAD).Trim()
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_SHA=$head" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "tag=$($env:RELEASE_TAG) version=$version sha=$head"

      - name: Keep the worktree clean for BUILD_INFO
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          git checkout --force HEAD
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            throw 'WORKTREE_DIRTY'
          }

      - name: Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Inno Setup 6.7.4
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $expected = 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C'
          curl.exe -fL --retry 5 --retry-delay 2 -o $dest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          if ($LASTEXITCODE -ne 0) { throw "INNO_DOWNLOAD_FAILED exit=$LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToUpperInvariant()
          if ($hash -ne $expected) { throw "INNO_HASH_MISMATCH $hash" }
          $log = Join-Path $env:RUNNER_TEMP 'inno-install.log'
          $proc = Start-Process -FilePath $dest -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS',"/LOG=$log"
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 80 }
            throw "INNO_INSTALL_FAILED exit=$($proc.ExitCode)"
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'ISCC_NOT_FOUND' }
          $length = (Get-Item -LiteralPath $iscc).Length
          if ($length -lt 500KB) { throw "ISCC_TOO_SMALL $length" }
          $PSNativeCommandUseErrorActionPreference = $false
          $help = & $iscc '/?' 2>&1 | Out-String
          Write-Host $help
          if ($help -notmatch 'Inno Setup' -or $help -notmatch '6\.7\.4') {
            throw "ISCC_BANNER_MISSING length=$length"
          }
          $detected = '6.7.4'
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INNO_SETUP_VERSION=$detected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC $iscc version=$detected bytes=$length"

      - name: Fetch pinned CPython and tzdata
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:GITHUB_WORKSPACE '..\.tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $pythonZip = Join-Path $tools 'python-embed.zip'
          $tzdata = Join-Path $tools 'tzdata.whl'
          curl.exe -fL --retry 5 --retry-delay 2 -o $pythonZip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_DOWNLOAD_FAILED exit=$LASTEXITCODE" }
          curl.exe -fL --retry 5 --retry-delay 2 -o $tzdata https://files.pythonhosted.org/packages/0a/66/9a06c2227fedfd4919f0eaaa8b94377d9730882a7e4f95823c9a331ab5e1/tzdata-2026.6-py2.py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw "TZDATA_DOWNLOAD_FAILED exit=$LASTEXITCODE" }
          $pythonHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $pythonZip).Hash.ToUpperInvariant()
          $tzHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tzdata).Hash.ToUpperInvariant()
          if ($pythonHash -ne '4ACBED6DD1C744B0376E3B1CF57CE906F9DC9E95E68824584C8099A63025A3C3') {
            throw "PYTHON_EMBED_HASH_MISMATCH $pythonHash"
          }
          if ($tzHash -ne '0A10EEC6E13EF16B627FABED9A5F2BA61A62B1C67F327305F4E7E412A70B4AEC') {
            throw "TZDATA_HASH_MISMATCH $tzHash"
          }
          Write-Host "Pinned CPython and tzdata hashes match."

      - name: Build installer
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/build-windows-installer.ps1 -Version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "INSTALLER_BUILD_FAILED exit=$LASTEXITCODE" }

      - name: Check BUILD_INFO and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist\installer\Stratide-Setup-$version-x64.exe"
          $sums = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\SHA256SUMS.txt'
          $infoPath = Join-Path $env:GITHUB_WORKSPACE 'dist\app\BUILD_INFO.json'
          if (-not (Test-Path -LiteralPath $setup)) { throw 'INSTALLER_NOT_PRODUCED' }
          $info = Get-Content -LiteralPath $infoPath -Raw | ConvertFrom-Json
          if ($info.version -ne $version) { throw "VERSION_MISMATCH $($info.version)" }
          if ($info.commit -ne $env:SOURCE_SHA) { throw "COMMIT_MISMATCH $($info.commit)" }
          if ($info.paper_only -ne $true -or $info.live_broker -ne $false -or $info.unsigned -ne $true) {
            throw 'BUILD_INFO_BOUNDARY'
          }
          if ($info.architecture -ne 'x64') { throw "ARCH $($info.architecture)" }
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToUpperInvariant()
          $first = (Get-Content -LiteralPath $sums -TotalCount 1).Trim()
          if ($first -notmatch ("^" + [regex]::Escape($setupHash) + "\s+Stratide-Setup-" + [regex]::Escape($version) + "-x64\.exe$")) {
            throw "SHA256SUMS_MISMATCH $first"
          }
          $size = (Get-Item -LiteralPath $setup).Length
          if ($size -lt 8MB) { throw "INSTALLER_TOO_SMALL $size" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @(
            "## Stratide $version",
            "",
            "- tag: $($env:RELEASE_TAG)",
            "- commit: $($env:SOURCE_SHA)",
            "- installer: Stratide-Setup-$version-x64.exe",
            "- bytes: $size",
            "- sha256: $setupHash"
          )
          "INSTALLER_SHA256=$setupHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_BYTES=$size" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SHA256 $setupHash"
          Write-Host "BYTES $size"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratide-windows-installer
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist\installer\Stratide-Setup-$version-x64.exe"
          $sums = Join-Path $env:GITHUB_WORKSPACE 'dist\installer\SHA256SUMS.txt'
          $notes = Join-Path $env:GITHUB_WORKSPACE ".github\release-notes\$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "MISSING_RELEASE_NOTES $notes" }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Copy-Item -LiteralPath $notes -Destination $notesFile
          Add-Content -LiteralPath $notesFile -Encoding utf8 -Value @(
            "",
            "### 本次附件",
            "",
            "| 文件 | 大小 | SHA256 |",
            "| --- | ---: | --- |",
            "| Stratide-Setup-$version-x64.exe | $($env:INSTALLER_BYTES) bytes | $($env:INSTALLER_SHA256) |"
          )
          gh release view $tag --json tagName 1>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sums --clobber
            if ($LASTEXITCODE -ne 0) { throw "RELEASE_UPLOAD_FAILED exit=$LASTEXITCODE" }
            gh release edit $tag --title "Stratide $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "RELEASE_EDIT_FAILED exit=$LASTEXITCODE" }
          } else {
            gh release create $tag $setup $sums --title "Stratide $tag" --notes-file $notesFile --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "RELEASE_CREATE_FAILED exit=$LASTEXITCODE" }
          }
          $url = gh release view $tag --json url -q .url
          if ($LASTEXITCODE -ne 0 -or -not $url) { throw 'RELEASE_VIEW_FAILED' }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "- release: $url"
          Write-Host "RELEASE_URL $url"
