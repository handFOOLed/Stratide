# Narrow Windows MSVC regression for Draft PR #93 (settings / WSL status reliability).
# Public repo: standard windows-latest runners only; no secrets and no cache.
# The regression job uploads nothing. A second job, only on the install-bug branch,
# builds an unsigned installer and uploads it as an Actions artifact. It does not
# publish a GitHub Release or push a tag.
name: PR93 Windows settings status

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr93-windows-settings-status.yml
      - apps/stratided/**
      - apps/dashboard/**
      - crates/runtime/**
      - scripts/build-windows-installer.ps1
      - scripts/verify-windows-installer-identity.ps1
      - scripts/test-paper-portfolio.py
      - research/**
      - apps/stratide-launcher/**
      - installer/Stratide.iss
      - assets/brand/stratide.ico
  push:
    branches: [cursor/settings-status-wsl-health-474a]
    paths:
      - .github/workflows/pr93-windows-settings-status.yml
      - apps/stratided/**
      - apps/dashboard/**
      - crates/runtime/**
      - scripts/build-windows-installer.ps1
      - scripts/verify-windows-installer-identity.ps1
      - scripts/test-paper-portfolio.py
      - research/**
      - apps/stratide-launcher/**
      - installer/Stratide.iss
      - assets/brand/stratide.ico

concurrency:
  group: pr93-windows-settings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-msvc-regression:
    name: MSVC check and regressions
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Whole-service stratided type-check (all targets)
        shell: bash
        run: cargo check -p stratided --all-targets --locked

      - name: stratide-runtime unit tests
        shell: bash
        run: cargo test -p stratide-runtime --locked

      - name: stratided runtime_status_cache unit tests
        shell: bash
        run: cargo test -p stratided runtime_status_cache --locked -- --test-threads=1

      - name: stratided runtime_status_health integration
        shell: bash
        run: cargo test -p stratided --test runtime_status_health --locked

      - name: Dashboard typecheck, build, status tests
        shell: bash
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paper watch log and snapshot regressions
        shell: bash
        run: |
          python -m unittest \
            scripts.test-paper-portfolio.Tests.test_missing_snapshot_stays_blocked_and_handler_does_not_crash \
            scripts.test-paper-portfolio.Tests.test_cli_snapshot_missing_reports_blocked_without_nameerror \
            scripts.test-paper-portfolio.Tests.test_watch_log_uses_real_screen_and_policy_shapes \
            scripts.test-paper-portfolio.Tests.test_watch_log_cap_keeps_existing_file_and_later_errors \
            scripts.test-paper-portfolio.Tests.test_watch_missing_snapshot_prints_code_not_handler_crash_or_bulk \
            scripts.test-paper-portfolio.Tests.test_research_fault_does_not_skip_paper_confirmation_or_collection \
            scripts.test-paper-portfolio.Tests.test_optional_paper_import_failure_keeps_watch_polling_and_stop_propagates \
            scripts.test-market-eod.MarketTests.test_watch_disabled_but_unreadable_agent_does_not_stop_collection \
            scripts.test-market-eod.MarketTests.test_watch_enabled_agent_write_failure_does_not_stop_collection \
            scripts.test-market-eod.MarketTests.test_watch_worker_failure_does_not_stop_collection \
            scripts.test-market-eod.MarketTests.test_once_research_failure_keeps_successful_eod_result \
            scripts.test-market-eod.MarketTests.test_watch_explicit_stop_from_research_still_propagates

  # Exact-head unsigned installer for this draft branch only. contents stays
  # read-only, so this job cannot create a Release. actions:write is only for
  # the test artifact.
  windows-installer-artifact:
    name: Unsigned installer artifact
    needs: windows-msvc-regression
    if: github.event_name == 'pull_request' && github.head_ref == 'cursor/round1-install-bugs-b2d0'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Inno Setup 6.7.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $expected = 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C'
          # The release HTML URL has been returning HTTP 504. The immutable
          # asset API redirects to release-assets.githubusercontent.com. Hash
          # is checked before the installer is executed. No token is sent.
          $urls = @(
            'https://api.github.com/repos/jrsoftware/issrc/releases/assets/686086859',
            'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          )
          $downloaded = $false
          foreach ($url in $urls) {
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Force }
            curl.exe -fL --retry 4 --retry-all-errors --retry-delay 3 -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $dest $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $dest)) { continue }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToUpperInvariant()
            if ($hash -eq $expected) { $downloaded = $true; break }
            Remove-Item -LiteralPath $dest -Force
          }
          if (-not $downloaded) { throw "INNO_DOWNLOAD_FAILED expected=$expected" }
          $log = Join-Path $env:RUNNER_TEMP 'inno-install.log'
          $proc = Start-Process -FilePath $dest -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS',"/LOG=$log"
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 80 }
            throw "INNO_INSTALL_FAILED exit=$($proc.ExitCode)"
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'ISCC_NOT_FOUND' }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INNO_SETUP_VERSION=6.7.4" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch pinned CPython and tzdata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:GITHUB_WORKSPACE '..\.tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $pythonZip = Join-Path $tools 'python-embed.zip'
          $tzdata = Join-Path $tools 'tzdata.whl'
          curl.exe -fL --retry 5 --retry-delay 2 -o $pythonZip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_DOWNLOAD_FAILED exit=$LASTEXITCODE" }
          curl.exe -fL --retry 5 --retry-delay 2 -o $tzdata https://files.pythonhosted.org/packages/0a/66/9a06c2227fedfd4919f0eaaa8b94377d9730882a7e4f95823c9a331ab5e1/tzdata-2026.6-py2.py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw "TZDATA_DOWNLOAD_FAILED exit=$LASTEXITCODE" }
          $pythonHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $pythonZip).Hash.ToUpperInvariant()
          $tzHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tzdata).Hash.ToUpperInvariant()
          if ($pythonHash -ne '4ACBED6DD1C744B0376E3B1CF57CE906F9DC9E95E68824584C8099A63025A3C3') {
            throw "PYTHON_EMBED_HASH_MISMATCH $pythonHash"
          }
          if ($tzHash -ne '0A10EEC6E13EF16B627FABED9A5F2BA61A62B1C67F327305F4E7E412A70B4AEC') {
            throw "TZDATA_HASH_MISMATCH $tzHash"
          }

      - name: Read source version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath apps/dashboard/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.3.2') { throw "REFUSING_VERSION_CHANGE $version" }
          "SOURCE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_SHA=${{ github.event.pull_request.head.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/build-windows-installer.ps1 -Version $env:SOURCE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "INSTALLER_BUILD_FAILED exit=$LASTEXITCODE" }

      - name: Check identity, icon resources, and shortcut wiring
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/verify-windows-installer-identity.ps1 -SourceSha $env:SOURCE_SHA -Version $env:SOURCE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "INSTALLER_IDENTITY_FAILED exit=$LASTEXITCODE" }

      # Isolated runner temp only. Silent install does not launch the app.
      # No token, no provider call, no WSL, and no data outside RUNNER_TEMP.
      - name: Install and status smoke in runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'stratide-install-smoke'
          $app = Join-Path $root 'app'
          $smokeHome = Join-Path $root 'home'
          $smokeData = Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $app, $smokeHome, $smokeData | Out-Null
          $setup = Get-ChildItem -LiteralPath dist/installer -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'SETUP_EXE_MISSING' }
          $log = Join-Path $root 'install.log'
          $args = @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',
            '/MERGETASKS=!desktopicon',
            "/DIR=$app","/HOME=$smokeHome","/DATA=$smokeData","/LOG=$log"
          )
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 80 }
            throw "INSTALL_SMOKE_FAILED exit=$($proc.ExitCode)"
          }
          $infoPath = Join-Path $app 'BUILD_INFO.json'
          if (-not (Test-Path -LiteralPath $infoPath)) { throw 'INSTALLED_BUILD_INFO_MISSING' }
          $info = Get-Content -LiteralPath $infoPath -Raw | ConvertFrom-Json
          if ($info.commit -ne $env:SOURCE_SHA) { throw "INSTALLED_COMMIT_MISMATCH $($info.commit)" }
          if ($info.version -ne $env:SOURCE_VERSION) { throw "INSTALLED_VERSION_MISMATCH $($info.version)" }
          if ($info.unsigned -ne $true -or $info.paper_only -ne $true -or $info.live_broker -ne $false) {
            throw 'INSTALLED_IDENTITY_FLAGS'
          }
          $launcher = Join-Path $app 'stratide-launcher.exe'
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'LAUNCHER_MISSING' }
          $status = Join-Path $root 'status.json'
          & $launcher --home $smokeHome --status --status-file $status --quiet
          if ($LASTEXITCODE -ne 0) { throw "STATUS_SMOKE_FAILED exit=$LASTEXITCODE" }
          $body = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
          $gotHome = [IO.Path]::GetFullPath([string]$body.layout.home)
          $wantHome = [IO.Path]::GetFullPath($smokeHome)
          if ($gotHome -ne $wantHome) { throw "STATUS_HOME_MISMATCH $gotHome" }
          if ($body.health.healthy -eq $true) { throw 'STATUS_SMOKE_UNEXPECTED_HEALTHY' }
          $running = Get-Process -Name stratided,stratide-launcher -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "$app*" }
          if ($running) { throw 'SMOKE_LEFT_A_PROCESS' }
          "INSTALL_SMOKE_OK commit=$($info.commit) home=$smokeHome"

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: stratide-windows-installer-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
            dist/app/BUILD_INFO.json
