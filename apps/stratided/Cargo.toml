[package]
name = "stratided"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
stratide-contracts = { path = "../../crates/contracts" }
stratide-ledger = { path = "../../crates/ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
csv = "1.4"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
fs2 = "0.4"
